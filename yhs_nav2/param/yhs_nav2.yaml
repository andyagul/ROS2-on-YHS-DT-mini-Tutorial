amcl:
  ros__parameters:
    alpha1: 0.1 #里程计噪声0.2
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 48.0 #描述要考虑的最大扫描范围，设为-1.0会直接使用激光报告的最大范围
    laser_min_range: 0.5  #描述要考虑的最小扫描范围，-1.0将使用激光发出的的最小范围
    laser_model_type: "likelihood_field"  #描述使用哪个模型，beam、likelihood_field 或 likelihood_field_prob。likelihood_field_prob 包含beamskip功能
    max_beams: 48 #描述更新过滤器时，设置每次扫描要使用多少个均匀间隔的光束60
    max_particles: 5000 #描述所允许的最大粒子数2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  #描述插件类的完全限定类型。可以值为nav2_amcl::DifferentialMotionModel和nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true  #描述用于设置是否广播坐标变换。参数False可以以防止amcl发布全局坐标系和里程计坐标系之间的坐标变换map->odom
    transform_tolerance: 1.0
    update_min_a: 0.2 #描述在执行过滤器更新之前需要的最小旋转角度
    update_min_d: 0.1 #描述在执行过滤器更新之前需要的最小平移距离0.25
    z_hit: 0.5
    z_max: 0.5
    z_rand: 0.5
    z_short: 0.5
    scan_topic: scan
    set_initial_pose: True  #描述AMCL从参数 initial_pose* 设置机器人初始姿势，而不是等待话题 [initial_pose `消息False
    initial_pose: #描述全局坐标系中机器人底座初始位姿的X、Y、Z坐标和偏航角（单位为米和弧度）
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    bt_loop_duration: 50
    default_server_timeout: 20
    enable_groot_monitoring: True #表示是否启用Groot监视器，用于监视行为树的执行情况
    groot_zmq_publisher_port: 1666  #表示Groot监视器的ZMQ发布器端口
    groot_zmq_server_port: 1667 #表示Groot监视器的ZMQ服务器端口
    plugin_lib_names: #表示要加载的插件库的名称列表，用于扩展行为树导航器的功能
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_follow_record_path_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0  #控制器的控制频率
    min_x_velocity_threshold: 0.001 #机器人在x轴最小线速度
    min_y_velocity_threshold: 0.5 #机器人在y轴最小线速度
    min_theta_velocity_threshold: 0.001 #机器人的最小旋转角速度
    failure_tolerance: 0.3  #机器人执行导航任务时容忍的失败次数。如果机器人在执行导航任务时达到了设定的失败次数，controller_server节点会认为该导航任务失败，停止机器人的运动并返回失败信息
    progress_checker_plugin: "progress_checker" #用于指定机器人在沿着全局路径移动时的路径跟踪插件
    goal_checker_plugins: ["general_goal_checker"] #用于指定机器人在执行导航任务时的目标检测插件
    controller_plugins: ["FollowPath"]  #用于指定机器人在执行导航任务时的运动控制插件

    # Progress checker parameters
    progress_checker: #progress_checker插件会根据机器人当前位置和全局路径信息，计算机器人需要沿着全局路径移动的下一个位置，并将该位置作为机器人的目标位置进行控制
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 #用于控制机器人沿着全局路径移动时的偏差容忍度。该参数的默认值为0.5m
      movement_time_allowance: 10.0 #用于控制机器人沿着全局路径移动时的时间容忍度。该参数的默认值为10s，即机器人在沿着全局路径移动时允许的时间为10s。如果机器人在沿着全局路径移动的时间超过了该时间，progress_checker插件会认为机器人超时了，需要及时调整机器人的运动控制，以确保机器人能够按照预定时间内完成导航任务
    
    general_goal_checker: #插件会根据机器人当前位置和目标点信息，计算机器人需要到达的最终目标点，并将该点作为机器人的目标位置进行控制
      stateful: True  #参数用于指定该插件是否需要维护状态信息。如果设置为 True，该插件会在机器人到达目标位置时将状态信息存储下来，以便后续的任务调度和统计分析
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1

    # TEB parameters
    FollowPath: #插件会根据机器人当前位置和全局路径信息，计算机器人需要采取的线速度和角速度
      plugin: teb_local_planner::TebLocalPlannerROS

      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: True
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      global_plan_viapoint_sep: 0.0
      global_plan_prune_distance: 1.0
      control_look_ahead_poses: 2
      exact_arc_length: False
      feasibility_check_no_poses: 2
      publish_feedback: False
          
      # Robot    
      max_vel_x: 0.5
      max_vel_theta: 0.3
      acc_lim_x: 0.3
      acc_lim_theta: 0.3

      footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
        type: "circular"
        radius: 0.1 # for type "circular"
        
      min_turning_radius: 0.0 # diff-drive robot (can turn on place!)

      # GoalTolerance
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
              
      free_goal_vel: False
          
      # Obstacles 
      min_obstacle_dist: 0.45
      inflation_dist: 0.6
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 3.0
      obstacle_poses_affected: 15

      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: True 

      costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5

      # Optimization     
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 10.5
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 1000.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0 # must be > 0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 10.0 # not in use yet
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 50.0
      weight_adapt_factor: 2.0

      # Homotopy Class Planner
      enable_homotopy_class_planning: False
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True

      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

      # Recovery
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
#      robot_radius: 0.22
      footprint: "[[0.31,0.26],[0.31,-0.26],[-0.31,-0.26],[-0.31,0.26]]" 
      plugins: ["static_layer", "obstacle_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan scan1
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
        scan1:
          topic: /scan1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
#      robot_radius: 0.22
      footprint: "[[0.31,0.26],[0.31,-0.26],[-0.31,-0.26],[-0.31,0.26]]"     
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan scan1
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        scan1:
          topic: /scan1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.15
    occupied_thresh_default: 0.55
    map_subscribe_transient_local: True

