# ============================================================
# 交通标识牌识别与响应 - 参数配置
# ============================================================

traffic_sign_response:
  ros__parameters:
    # ==================== 检测参数 ====================
    # YOLOv8模型权重文件路径 (相对/绝对路径均可)
    model_path: "models/traffic_sign_yolov8n.pt"
    # 推理设备 ('cpu', 'cuda', '0')
    device: "cpu"
    # 置信度阈值 (0-1)，低于此值的检测结果被过滤
    confidence_threshold: 0.5

    # ==================== 距离感知参数 ====================
    # 测距方法: 'depth'(深度相机) 或 'monocular'(单目几何)
    distance_method: "depth"
    # 标识牌实际物理尺寸 (米)
    sign_real_width: 0.6
    sign_real_height: 0.6
    # 相机内参 (Orbbec Astra 系列典型值，实际使用需标定)
    camera_fx: 525.0
    camera_fy: 525.0
    camera_cx: 319.5
    camera_cy: 239.5

    # ==================== 控制触发参数 ====================
    # 触发控制的距离阈值 (米)
    trigger_distance: 0.5
    # 连续确认次数 (防止误触发)
    confirm_count: 3
    # 指令冷却时间 (秒) - 执行完一次指令后等待多久才能再次触发
    cooldown: 5.0

    # ==================== 异常处理参数 ====================
    # 低置信度阈值
    low_confidence_threshold: 0.4

    # ==================== 调试参数 ====================
    # 是否启用实际控制（调试时可设为false只检测不控制）
    enable_control: true
